const st={m:"all",term:"m",size:"",floor:"",view:"",quota:"",price:"",status:"",sort:"price",shown:24};

const fl=u=>parseInt(u.floor,10)||0;
const rentOf=u=>st.term==="y"?(u.rentYM||0):(u.rentM||0); // rentYM = per month on a 1-year contract
const amount=u=>u.grp==="rent"?rentOf(u):(u.price||0);
function opts(sel,list,cur){sel.innerHTML=list.map(([v,k])=>'<option value="'+v+'"'+(v===cur?" selected":"")+'>'+t(k)+'</option>').join("");}
function buildFilters(){
  opts($("#fSize"),[["","f.size"],["s1","f.s1"],["s2","f.s2"],["s3","f.s3"],["s4","f.s4"]],st.size);
  opts($("#fFloor"),[["","f.floor"],["fl1","f.fl1"],["fl2","f.fl2"],["fl3","f.fl3"]],st.floor);
  opts($("#fView"),[["","f.view"],["front","v.front"],["pattaya","v.pattaya"],["jomtien","v.jomtien"]],st.view);
  opts($("#fQuota"),[["","f.quota"],["th","q.th"],["fr","q.fr"]],st.quota);
  const r=st.m==="rent";
  opts($("#fPrice"),r?[["","f.price"],["r1","p.r1"],["r2","p.r2"],["r3","p.r3"],["r4","p.r4"]]:[["","f.price"],["b1","p.b1"],["b2","p.b2"],["b3","p.b3"],["b4","p.b4"]],st.price);
  opts($("#fStatus"),[["","f.status"],["avail","f.avail"],["soon","f.soon"],["reserved","f.reserved"]],st.status);
  opts($("#fSort"),[["price","o.price"],["priceD","o.priceD"],["size","o.size"],["floor","o.floor"]],st.sort);
  $("#rTerm").hidden=!r; $("#fQuota").hidden=r; if(r) st.quota="";
}
function list(){
  return UNITS.filter(u=>{
    if(st.m!=="all"&&u.grp!==st.m) return false;
    if(st.size){const [a,b]=SIZE[st.size]; if(!(u.sqm>=a&&u.sqm<b)) return false;}
    if(st.floor){const [a,b]=FLOOR[st.floor]; if(!(fl(u)>=a&&fl(u)<=b)) return false;}
    if(st.view&&(u.side||u.view)!==st.view) return false;
    if(st.quota&&u.q!==st.quota) return false;
    if(st.status&&u.status!==st.status) return false;
    if(st.price){const R=(st.m==="rent"?RENT:BUY)[st.price]; if(R){const v=st.m==="rent"?rentOf(u):(u.grp==="rent"?0:u.price||0); if(!(v>=R[0]&&v<R[1])) return false;}}
    return true;
  }).sort((a,b)=>{
    const pa=amount(a)||Infinity, pb=amount(b)||Infinity;
    if(st.sort==="priceD") return (amount(b)||0)-(amount(a)||0);
    if(st.sort==="size") return b.sqm-a.sqm;
    if(st.sort==="floor") return fl(b)-fl(a);
    return pa-pb;
  });
}
function card(u){
  const tp=TYPE_PHOTO[u.type]||[SHOW35[0],"ph.sample"], img=u.photo||(tp[1]==="ph.sample"?(u.sqm<31?SHOW29[UNITS.indexOf(u)%2]:SHOW35[UNITS.indexOf(u)%3]):tp[0]), cap=u.photo?"":'<span class="phcap">'+t(tp[1])+'</span>';

  else price=u.price?fmt(u.price)+' <small>฿'+(u.psm?' · '+fmt(u.psm)+' ฿/'+t("sqmU"):'')+'</small>':'<small>'+t("ask")+'</small>';
  const y=(u.grp!=="rent"&&u.price&&u.rentM)?'<div class="yld">'+t("yld",{n:(u.rentM*12/u.price*100).toFixed(1)})+'</div>':"";
  const g=t("b."+u.grp);
  return '<article class="card"><div class="ph"><img src="'+img+'" alt="" loading="lazy"><span class="badge '+u.grp+'">'+g+'</span><span class="st'+(u.status==="reserved"?" res":u.status==="soon"?" soon":"")+'">'+(u.status==="soon"?(u.from?t("s.from",{d:dShort(u.from)}):t("s.soon")):t("s."+(u.status||"avail")))+'</span>'+cap+'</div>'+
   '<div class="bd"><h3>'+u.id+'</h3><div class="specs"><span>'+t("floor",{n:u.floor})+'</span><span>'+t("sqm",{n:u.sqm})+'</span>'+(u.type?'<span>'+t("ty."+u.type)+'</span>':"")+((u.side||u.view)?'<span>'+t("v."+(u.side||u.view))+'</span>':"")+(u.q?'<span class="q '+u.q+'">'+t("q."+u.q)+'</span>':"")+'</div>'+
   '<div class="price">'+price+'</div>'+y+(u.note?'<p class="note">'+u.note+'</p>':"")+
   '<div class="acts"><a class="btn line sm" target="_blank" rel="noopener" href="'+lineURL(t("lm.unit",{u:u.id,g}))+'">'+t("card.ask")+'</a></div></div></article>';
}
function render(){

  empty.querySelector("b").textContent=UNITS.length?"":t("e.h"); empty.querySelector("b").hidden=!!UNITS.length;

}

  $$(".langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===LANG)));
  buildFilters(); renderStatic(); renderGal(); render(); calc();
}
$$(".langs button").forEach(b=>b.addEventListener("click",()=>{LANG=b.dataset.lang; try{localStorage.setItem("copa1-lang",LANG);}catch(e){} applyLang();}));
