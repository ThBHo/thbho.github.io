<style>
/* Copa1 · Copacabana Beach Jomtien (ready to move in): buy from developer / resale / rent.
   Layout family of CoralReefSale-v2 (topbar, hero, toolbar, cards), own palette:
   ivory + cream base, burgundy for trust headings, gold accents, deep teal for closing actions (Thor's chart, Nov–Dec 2026). */
:root{
  --burg:#7A1F2B; --burg2:#94303D; --gold:#A8803F; --gold2:#C9A15A; --teal:#0F6B66; --teal2:#138A83;
  --bg:#FFFCF7; --alt:#F6EFE3; --surface:#FFFFFF; --ink:#2B1D1A; --muted:#6E6259; --line:#E8DDCB; --chip:#F1E8D9;
  --dev:#A8803F; --resale:#7A1F2B; --rent:#0F6B66;
  --shadow:0 1px 2px rgba(60,30,20,.05),0 10px 26px rgba(60,30,20,.07);
  --f-display:"Bodoni Moda","Noto Serif Thai",Georgia,serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gut:max(16px,env(safe-area-inset-left,0px)); --gutr:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.65 var(--f-body);overflow-x:hidden}
img,video{max-width:100%;display:block}
a{color:var(--teal)}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.2;margin:0;color:var(--burg)}
:lang(th) h1,:lang(th) h2,:lang(th) h3{font-family:"Noto Serif Thai","Bodoni Moda",serif}
.wrap{max-width:1200px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 11px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--gold);background:var(--gold);color:#fff;font-weight:600;font-size:14.5px;text-decoration:none;cursor:pointer}
.btn.line{background:var(--teal);border-color:var(--teal)}.btn.line::before{content:"";width:8px;height:8px;border-radius:50%;background:#06C755;flex:none}
.btn.teal{background:var(--teal);border-color:var(--teal)}
.btn.ghost{background:transparent;color:var(--burg);border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px;border-radius:9px}
.btn:focus-visible,button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}
.pending{display:inline-block;font:600 10.5px var(--f-mono);letter-spacing:.04em;color:var(--burg);background:color-mix(in srgb,var(--burg) 10%,transparent);border:1px dashed color-mix(in srgb,var(--burg) 45%,transparent);padding:1px 7px;border-radius:6px;margin-left:6px;vertical-align:middle;white-space:nowrap}

/* topbar */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-width:0}
.brand img{height:36px;width:auto}.brand .plogo{height:42px}.brand .glogo{height:26px;opacity:.9}
.brand .sep{width:1px;height:28px;background:var(--line)}
.brand b{display:block;font:600 15px/1.2 var(--f-display);color:var(--burg);white-space:nowrap}
.brand small{display:block;font:600 10.5px/1.3 var(--f-mono);letter-spacing:.08em;color:var(--gold);white-space:nowrap}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tbnav{display:flex;gap:2px}
.tbnav a{font-size:13.5px;font-weight:500;color:var(--ink);text-decoration:none;padding:6px 10px;border-radius:8px}
.tbnav a:hover{background:var(--chip)}
.langs{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.langs button{border:0;background:none;border-radius:999px;padding:4px 10px;font:600 11.5px var(--f-mono);color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--burg);color:#fff}
@media (max-width:900px){.tbnav{display:none}}
@media (max-width:560px){.brand .txt{display:none}.brand .plogo{height:36px}.brand .glogo{height:22px}}
.draftbar{background:repeating-linear-gradient(135deg,#A8803F 0 12px,#97733A 12px 24px);color:#fff;text-align:center;font-size:12px;line-height:1.4;padding:5px 16px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 10px}
.draftbar b{font-family:var(--f-mono);letter-spacing:.08em}

/* hero */
.phero{position:relative;height:min(80vh,660px);min-height:460px;overflow:hidden;background:#1E1512;color:#fff}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
.slide.on{opacity:1}
.slide img,.phero video{width:100%;height:100%;object-fit:cover}
.phero video{position:absolute;inset:0}
.hnav{position:absolute;z-index:3;top:42%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:rgba(30,16,12,.35);color:#fff;font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(4px)}
.hnav.l{left:14px}.hnav.r{right:14px}.hnav:hover{background:rgba(30,16,12,.6)}
@media (max-width:620px){.hnav{width:34px;height:34px;font-size:20px;top:30%}}
#dots i{cursor:pointer}
.phero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(30,16,12,.62) 0%,rgba(30,16,12,.28) 45%,rgba(30,16,12,0) 70%),linear-gradient(180deg,rgba(30,16,12,0) 45%,rgba(30,16,12,.55) 100%);pointer-events:none}
.ptag{position:absolute;top:14px;right:14px;z-index:3;font:600 11px var(--f-mono);letter-spacing:.06em;padding:5px 10px;border-radius:999px;background:rgba(15,107,102,.9);color:#fff}
.phero .copy{position:absolute;z-index:2;left:0;right:0;bottom:0;padding-bottom:34px}
.phero .eyebrow{color:#E8CF9A}
.phero h1{color:#fff;font-size:clamp(34px,6vw,62px);margin:8px 0 10px;max-width:780px}
.phero .sub{max-width:560px;margin:0 0 18px;color:#F4ECE2;font-size:16px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.pills span{font:600 12.5px var(--f-body);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);backdrop-filter:blur(4px)}
.hcta{display:flex;flex-wrap:wrap;gap:10px}
.dots{position:absolute;z-index:3;left:var(--gut);top:16px;display:flex;gap:6px}
.dots i{width:22px;height:3px;border-radius:2px;background:rgba(255,255,255,.4)}
.dots i.on{background:#fff}
@media (max-width:700px){.phero{height:auto;min-height:600px}.phero::after{background:linear-gradient(180deg,rgba(30,16,12,.05) 0%,rgba(30,16,12,.25) 35%,rgba(30,16,12,.86) 72%)}}

/* sections */
.sec{padding:52px 0}
.sec.alt{background:var(--alt)}
.sec-h{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 18px;margin-bottom:18px}
.sec-h h2{font-size:clamp(24px,3.2vw,34px);margin-top:6px}
.lead{font-size:16px;margin:0;max-width:760px}

/* mode switch */
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0 14px}
.mode{display:grid;gap:2px;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;box-shadow:var(--shadow)}
.mode b{font-size:15.5px;color:var(--ink)}
.mode small{font-size:12.5px;color:var(--muted)}
.mode .n{font:600 12px var(--f-mono);color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--mc,var(--burg));background:color-mix(in srgb,var(--mc,var(--burg)) 7%,var(--surface))}
.mode[aria-pressed="true"] b{color:var(--mc,var(--burg))}
.mode[data-m="dev"]{--mc:var(--dev)}.mode[data-m="resale"]{--mc:var(--resale)}.mode[data-m="rent"]{--mc:var(--rent)}
@media (max-width:760px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tbar select{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;font-size:13.5px;min-width:0;flex:1 1 140px}
.tbar label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.rterm{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.rterm button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.rterm button[aria-pressed="true"]{background:var(--teal);color:#fff}
.tmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 2px 0;font-size:13px;color:var(--muted)}
.link{border:0;background:none;padding:0;color:var(--teal);font-weight:600;cursor:pointer;text-decoration:none;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:16px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.card .ph{position:relative;aspect-ratio:4/3;background:var(--chip)}
.card .ph img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;font:600 11px var(--f-mono);letter-spacing:.05em;padding:4px 9px;border-radius:999px;color:#fff;background:var(--bc)}
.badge.dev{--bc:var(--dev)}.badge.resale{--bc:var(--resale)}.badge.rent{--bc:var(--rent)}
.st{position:absolute;top:10px;right:10px;font:600 11px var(--f-mono);padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink)}
.st.res{background:rgba(43,29,26,.82);color:#fff}
.st.soon{background:rgba(168,128,63,.94);color:#fff}
.card .bd{display:grid;gap:8px;padding:14px 16px 16px;flex:1}
.phcap{position:absolute;left:10px;bottom:10px;font:500 11px var(--f-body);padding:3px 8px;border-radius:6px;background:rgba(43,29,26,.66);color:#fff}
.specs span.q{font-weight:600}.specs span.q.th{background:color-mix(in srgb,var(--burg) 12%,transparent);color:var(--burg)}.specs span.q.fr{background:color-mix(in srgb,var(--teal) 12%,transparent);color:var(--teal)}
.card h3{font-size:19px;color:var(--ink)}.card h3 a{color:inherit;text-decoration:none}.card h3 a:hover{color:var(--teal)}.card .ph{cursor:pointer}
.specs{display:flex;flex-wrap:wrap;gap:6px}
.specs span{font-size:12.5px;background:var(--chip);border-radius:7px;padding:3px 8px}
.price{font:600 20px var(--f-mono);color:var(--burg)}
.price small{font:500 12px var(--f-body);color:var(--muted)}
.yld{font-size:12.5px;color:var(--teal);font-weight:600}
.card .acts{margin-top:auto;display:flex;gap:8px}
.card .acts .btn{flex:1}
/* position plate + floor tower (same idea as the R2 page) */
.tower{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tower>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:12px 16px;font-weight:600;color:var(--burg)}
.tower>summary::-webkit-details-marker{display:none}
.tower>summary small{font-weight:400;color:var(--muted);font-size:12.5px}
.tower>summary::after{content:"▾";margin-left:auto;color:var(--muted)}.tower[open]>summary::after{content:"▴"}
.tw-rows{max-height:330px;overflow:auto;padding:4px 10px 8px;border-top:1px solid var(--line)}
.frow{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:8px;width:100%;border:0;background:none;padding:3px 6px;border-radius:6px;text-align:left;cursor:pointer;font:inherit}
.frow:hover{background:var(--alt)}
.frow[aria-pressed="true"]{background:color-mix(in srgb,var(--teal) 10%,transparent);box-shadow:inset 2px 0 0 var(--teal)}
.frow .fl{font:500 11.5px var(--f-mono);color:var(--muted);text-align:right}
.frow[aria-pressed="true"] .fl{color:var(--teal);font-weight:700}
.cells{display:flex;gap:3px;flex-wrap:wrap}
.cell{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--cc);background:var(--cc)}
.cell.dev{--cc:var(--dev)}.cell.resale{--cc:var(--resale)}.cell.rent{--cc:var(--rent)}
.cell.soon{background:transparent}.cell.reserved{opacity:.35}
.tw-leg{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 16px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.tw-leg span{display:inline-flex;align-items:center;gap:6px}
.chipx{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--teal);color:var(--teal);background:none;border-radius:999px;padding:2px 10px;font:600 12.5px var(--f-body);cursor:pointer;margin-left:8px}
#us{width:min(820px,100%);max-width:100%;max-height:calc(100dvh - 24px);margin:auto;padding:0;border:0;border-radius:18px;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(20,10,5,.35)}
#us::backdrop{background:rgba(30,15,10,.55)}
.us-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg);border-bottom:1px solid var(--line)}
.us-top h3{font:600 20px var(--f-mono);color:var(--burg)}
.us-top span{color:var(--muted);font-size:14px}
.us-x{margin-left:auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:16px;cursor:pointer;color:var(--ink)}
.us-bd{padding:6px 18px 22px;display:grid;gap:16px}
.us-bd h4{font:600 17px var(--f-display);color:var(--burg);margin:8px 0 -6px}
.plate{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 6px;-webkit-overflow-scrolling:touch}
.plate svg{display:block;width:100%;min-width:600px;height:auto}
.plate svg .uc{cursor:pointer}
.u-floor{display:grid;gap:6px}
.u-floor-cap{font-size:14px;color:var(--ink)}.u-floor-cap b{font-family:var(--f-mono)}
.u-floor-bar{display:flex;gap:2px;height:22px}
.u-floor-bar i{flex:1;border-radius:2px;background:var(--chip)}
.u-floor-bar i.res{background:color-mix(in srgb,var(--teal) 22%,var(--surface))}
.u-floor-bar i.on{background:var(--burg)}
.u-floor-legend{position:relative;height:16px;font:500 11px var(--f-mono);color:var(--muted)}
.u-floor-legend span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.u-floor-legend span.on{color:var(--burg);font-weight:700}
/* unit page (#/u/<code>): ASN-style layout — title, photo mosaic, then two columns with a sticky price card */
/* featured units (ASN-style cards with a photo strip) */
.feat .pk-blk{margin-top:22px}
.pk-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.pk-hd h3{font-size:22px;color:var(--burg)}
.pk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.pk{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;color:inherit;text-decoration:none}
.pk .ph{position:relative;aspect-ratio:4/3;background:var(--chip);overflow:hidden}
.pk .ph img{width:100%;height:100%;object-fit:cover;transition:opacity .25s}
.pk .ph .badge{position:absolute;left:10px;top:10px}
.pk .ph .tg{position:absolute;left:10px;bottom:10px;font:600 11px/1 var(--f-body);padding:5px 8px;border-radius:6px;background:rgba(43,29,26,.72);color:#fff}
.pk .ph .cnt{position:absolute;right:10px;bottom:10px;font:600 11px/1 var(--f-mono);padding:5px 8px;border-radius:6px;background:rgba(43,29,26,.72);color:#fff}
.pk .ph .nv{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,252,247,.9);color:var(--ink);font-size:18px;cursor:pointer;display:grid;place-items:center}
.pk .ph .nv.l{left:10px}.pk .ph .nv.r{right:10px}

.pk .code{font:600 12px var(--f-mono);color:var(--muted)}

@media (max-width:620px){.pk-grid{grid-template-columns:minmax(0,1fr)}}
.uv{padding:18px 0 56px}
.uv-back{display:inline-flex;gap:6px;font-size:13.5px;font-weight:600;color:var(--teal);text-decoration:none;margin-bottom:12px}
.uv-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}

.uv-loc{display:grid;gap:10px}
.uv-more{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.uv-toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:60}
body.uvon #top,body.uvon .mbar{display:none!important}

/* gallery + types */
.split{display:grid;gap:28px}

.gal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}

.types{display:grid;gap:8px;margin:10px 0 0;padding:0;list-style:none}

.awards b{display:block;color:var(--burg);font-size:14px}
.awards i{font-style:normal;font-size:22px;color:var(--gold)}

/* investor / tenant */
.cols3{display:grid;gap:14px;margin-top:18px}

.box{padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);display:grid;gap:10px;align-content:start}

.contact{display:grid;gap:20px}

.cl li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}

.foot{padding:28px 0 96px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

.brands img{height:22px;width:auto;border-radius:4px}
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;gap:8px;padding:10px var(--gutr) calc(10px + env(safe-area-inset-bottom,0px)) var(--gut);background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.mbar .btn{flex:1}

/* lightbox */
#lb{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:rgba(20,12,10,.96);color:#fff}

.lb-top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) var(--gutr) 10px var(--gut);font-size:14px}
#lbT{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-x{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:18px;cursor:pointer}
.lb-st{position:relative;display:grid;place-items:center;min-height:0;padding:0 8px calc(16px + env(safe-area-inset-bottom,0px))}
#lbI{max-width:100%;max-height:calc(100vh - 90px);object-fit:contain;border-radius:4px}
.lb-n{position:absolute;top:50%;translate:0 -50%;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:30px;line-height:1;cursor:pointer}
#lbP{left:10px}#lbN{right:10px}
.lb-full{color:#E8CF9A;font-size:13px;white-space:nowrap}
.lb-cap{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));translate:-50% 0;max-width:min(860px,92vw);margin:0;padding:8px 12px;border-radius:10px;background:rgba(20,12,10,.82);font-size:12.5px;line-height:1.5;text-align:center}
#lbI{background:#fff}
@media (max-width:700px){.lb-st{overflow:auto;place-items:center start;padding-bottom:120px}#lbI{max-width:none;max-height:none;height:58vh;width:auto}.lb-cap{position:fixed}}
@media (prefers-reduced-motion:reduce){.slide{transition:none}html{scroll-behavior:auto}}

  [["A03",0],["A02",1],["A01",2]].forEach(([k,i])=>c.push({k,x:i*33,y:0,w:31,h:H}));
  [["A04",0],["A05",1],["A06",2]].forEach(([k,i])=>c.push({k,x:i*33,y:yB,w:31,h:H}));
  for(let i=1;i<=9;i++) c.push({k:"B0"+i,x:xB+(i-1)*S,y:0,w:W,h:H});
  for(let i=1;i<=10;i++) c.push({k:"C"+String(i).padStart(2,"0"),x:xC+(i-1)*S,y:0,w:W,h:H});
  [6,5,4,3].forEach((n,i)=>c.push({k:"E0"+n,x:xB+i*S,y:yB,w:W,h:H}));
  c.push({k:"E02",x:xB+4*S,y:yB,w:2*S-2,h:H}); c.push({k:"E01",x:xB+4*S+S/2,y:yB,w:W,h:H});
  c.push({k:"D09",x:xB+8*S,y:yB,w:W,h:H});
  [8,7,6,5,4,3].forEach((n,i)=>c.push({k:"D0"+n,x:xC+i*S,y:yB,w:W,h:H}));
  c.push({k:"D02",x:xC+8*S,y:yB,w:W,h:H}); c.push({k:"D01",x:xC+9*S,y:yB,w:W,h:H});
  return {c,W,H,S,xB,xC,yB,width:xC+10*S};
}
function plateSVG(u){

  const cells=P.c.filter(c=>have.has(c.k)||c.k===here).map(c=>{
    const on=c.k===here, o=listed[c.k], n=+c.k.slice(1);
    const fill=on?"var(--burg)":o?"color-mix(in srgb,"+col[o.grp]+" 16%,var(--surface))":c.k[0]==="A"?"var(--alt)":"var(--chip)";
    const stroke=on?"var(--burg)":o?col[o.grp]:"var(--line)";

      '<text x="'+(c.x+c.w/2)+'" y="'+(c.y+c.h/2+4)+'" text-anchor="middle" font-size="10.5" font-family="IBM Plex Mono,monospace" fill="'+(on?"#fff":o?col[o.grp]:"var(--muted)")+'" font-weight="'+(on||o?700:400)+'">'+n+'</text></g>';
  }).join("");
  const lab=(x,y,s,a)=>'<text x="'+x+'" y="'+y+'" text-anchor="'+(a||"middle")+'" font-size="11" font-weight="700" fill="var(--ink)">'+s+'</text>';
  const side=(x,y,s,a)=>'<text x="'+x+'" y="'+y+'" text-anchor="'+(a||"start")+'" font-size="10.5" font-weight="700" letter-spacing=".06em" fill="var(--teal)">'+s+'</text>';
  let call="";
  const hc=P.c.find(c=>c.k===here);
  if(hc){const cx=hc.x+hc.w/2, top=hc.y===0, y=top?-34:P.yB+P.H+30, w=u.id.length*7.4+18;
    call='<g transform="translate('+cx+','+y+')"><rect x="'+(-w/2)+'" y="-13" width="'+w+'" height="19" rx="9.5" fill="var(--burg)"/><text y="1" text-anchor="middle" font-size="11.5" font-weight="700" font-family="IBM Plex Mono,monospace" fill="#fff">'+u.id+'</text></g>';}
  const hasA=have.has("A01");
  return '<svg viewBox="-34 -56 '+(P.width+44)+' '+(P.yB+P.H+120)+'" role="img" aria-label="'+t("us.loc")+' '+u.id+'">'+
    '<text x="-22" y="'+(P.yB/2+P.H/2)+'" transform="rotate(-90 -22 '+(P.yB/2+P.H/2)+')" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing=".06em" fill="var(--teal)">'+t("us.beach")+' ≋</text>'+
    side(P.xB,-44,t("us.pat")+" ↑")+side(P.xB,P.yB+P.H+52,t("us.jom")+" ↓")+
    (hasA?lab(48,-8,"A"):"")+lab(P.xB+4*P.S+P.W/2,-8,"B")+(have.has("C02")?lab(P.xC+4.5*P.S+P.W/2,-8,"C"):lab(P.xC+P.W/2,-8,"C"))+
    lab(P.xB+2*P.S,P.yB+P.H+16,"E")+lab((have.has("D07")?P.xC+3*P.S:P.xC)+P.W/2,P.yB+P.H+16,"D")+
    cells+call+'</svg>';

  if(R){ const tg=P.src?t("uv.tgSame",{c:P.src,f:P.srcFloor}):t("uv.tgR"); const AI=P.ai||[]; R.forEach(x=>out.push(AI.includes(+x.match(/(\d+)\.jpg$/)[1])?[x,t("uv.tgAI"),"ai"]:[x,tg,"real"])); if(p3) out.splice(Math.min(4,out.length),0,[p3.src,t("uv.tg3d"),"3d"]); }

    if(u.type==="2BRJ") S.push(["copa1-img/show/r72.jpg",k]);
    else if(u.type==="1BRP") S.push(["copa1-img/show/r80.jpg",k]);
    else if(u.sqm>=44&&u.sqm<46) S.push(["copa1-img/show/r45.jpg",k]);
    else if(u.sqm<31) SHOW29.forEach(x=>S.push([x,k]));

    if(S.length<4&&!(u.sqm<31)) SHOW35.slice(0,3).forEach(x=>{if(!S.some(y=>y[0]===x)) S.push([x,k]);});

const loadImg=src=>new Promise(r=>{const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src;});
function drawQR(ctx,text,x,y,size){
  if(typeof qrcode!=="function") return false;
  try{const qr=qrcode(0,"M"); qr.addData(text); qr.make(); const n=qr.getModuleCount(), pad=Math.round(size*.07), c=(size-pad*2)/n;
    ctx.fillStyle="#fff"; ctx.fillRect(x,y,size,size); ctx.fillStyle="#2B1D1A";
    for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(qr.isDark(r,k)) ctx.fillRect(x+pad+k*c,y+pad+r*c,Math.ceil(c),Math.ceil(c)); return true;}catch(e){return false;}

function sImgs(I){const L=I.room.slice(); if(I.p3) L.push([I.p3.src,"","3d"]); return L;}
async function drawPost(I){
  const lg=so.lg, S=SC[lg], [W,H]=RAT[so.ratio], PAD=56, {u,rent}=I;

  try{await document.fonts.ready;}catch(e){}
  const F=(w,s,m)=>w+" "+s+"px "+(m?"'IBM Plex Mono',ui-monospace,monospace":"'IBM Plex Sans Thai',system-ui,sans-serif");
  const L=sImgs(I), pick=L[so.img%Math.max(1,L.length)], bg=pick?await loadImg(pick[0]):null;
  ctx.fillStyle="#2B1D1A"; ctx.fillRect(0,0,W,H);
  if(bg){ if(pick[2]==="3d"){ctx.fillStyle="#FFFCF7"; ctx.fillRect(0,0,W,H); const s=Math.min(W/bg.width,H*.72/bg.height); ctx.drawImage(bg,(W-bg.width*s)/2,H*.06,bg.width*s,bg.height*s);}
    else{const s=Math.max(W/bg.width,H/bg.height), w=bg.width*s, h=bg.height*s; ctx.drawImage(bg,(W-w)/2,(H-h)/2,w,h);} }
  let g=ctx.createLinearGradient(0,0,0,H*.2); g.addColorStop(0,"rgba(43,29,26,.6)"); g.addColorStop(1,"rgba(43,29,26,0)"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H*.2);

  const bandH=rowsD.reduce((a,r)=>a+r.h+(r.gap||0),0)+PAD*2, fade=150;
  g=ctx.createLinearGradient(0,H-bandH-fade,0,H-bandH); g.addColorStop(0,"rgba(43,29,26,0)"); g.addColorStop(1,"rgba(43,29,26,.92)"); ctx.fillStyle=g; ctx.fillRect(0,H-bandH-fade,W,fade);
  ctx.fillStyle="rgba(43,29,26,.92)"; ctx.fillRect(0,H-bandH,W,bandH);
  ctx.fillStyle="#C9A15A"; ctx.fillRect(PAD,H-bandH+16,120,4);
  const qs=Math.min(210,bandH-60), hasQR=so.opt.qr&&drawQR(ctx,sUrl(u.id),W-PAD-qs,H-bandH+(bandH-qs)/2,qs), tw=W-PAD*2-(hasQR?qs+40:0);

  ctx.textAlign="left"; ctx.textBaseline="top"; let y=H-bandH+PAD;
  for(const r of rowsD){ ctx.font=fit(r.t,r.f,tw); ctx.fillStyle=r.c; if(r.suf){const pw=ctx.measureText(r.t).width; ctx.fillText(r.t,PAD,y); ctx.font=F(500,36); ctx.fillStyle="rgba(255,255,255,.85)"; ctx.fillText(r.suf,PAD+pw+16,y+42);} else if(r.sp){let x=PAD; for(const ch of r.t){ctx.fillText(ch,x,y); x+=ctx.measureText(ch).width+r.sp;}} else ctx.fillText(r.t,PAD,y); y+=r.h+(r.gap||0); }
  const logo=await loadImg("copa1-img/brand/logo-copa-beach.png"); if(logo){const lw=210; ctx.drawImage(logo,PAD,46,lw,lw*logo.height/logo.width);}
  const badge=tlg("b."+u.grp,lg); ctx.textBaseline="middle"; ctx.textAlign="center"; ctx.font=F(700,30);
  const bw=ctx.measureText(badge).width+56; ctx.fillStyle=u.grp==="rent"?"rgba(15,107,102,.9)":"rgba(122,31,43,.9)";

    ctx.fillStyle="rgba(43,29,26,.6)"; ctx.beginPath(); (ctx.roundRect?ctx.roundRect(W-PAD-w2,H-bandH-fade+40,w2,40,20):ctx.rect(W-PAD-w2,H-bandH-fade+40,w2,40)); ctx.fill(); ctx.fillStyle="#fff"; ctx.fillText(tag,W-PAD-w2/2,H-bandH-fade+60); }

function psmAvg(){ if(PSM_AVG) return PSM_AVG; const g={}; UNITS.forEach(u=>{ if(u.grp!=="rent"&&u.psm&&u.type)(g[u.type]??=[]).push(u.psm); }); PSM_AVG={}; for(const k in g) PSM_AVG[k]=g[k].reduce((a,b)=>a+b,0)/g[k].length; return PSM_AVG; }
const PC={};
function persona(u){ if(PC[u.id+u.grp]) return PC[u.id+u.grp];
  const face=faceOf(u), band=BAND(u), pool=u.type==="1BRP", jac=/J$/.test(u.type||""), beds=u.type==="2BRJ"?2:1, size=u.sqm||0;
  const A=psmAvg()[u.type], rel=(u.psm&&A)?(u.psm-A)/A:0;
  const light={W:"Sunset Sea",N:"Pattaya Light",S:"Jomtien Bay"}[face]||"", lift={low:"Beach",mid:"",high:"Sky",top:"Crown"}[band];
  const noun=pool?"Pool Suite":beds>=2?"Family Suite":jac?"Jacuzzi Suite":size>=40?"Grand Suite":size<=30?"Studio":"Suite";
  const name=[lift,light,noun].filter(Boolean).join(" ");
  const hl=[]; if(face) hl.push(["hl.face."+face,{}]); hl.push(["hl.band."+band,{}]);
  if(pool) hl.push(["hl.pool",{}]); else if(jac) hl.push(["hl.jac",{}]);
  if(rel<=-0.03) hl.push(["hl.value",{n:Math.round(-rel*100)}]); else if(beds>=2) hl.push(["hl.two",{}]);
  const s={NT:0,SJ:0,NF:0,SP:0};
  if(band==="high"||band==="top") s.NT+=3; if(face==="W") s.NT+=1;
  if(band==="mid") s.SJ+=2; if(rel<=-0.03) s.SJ+=2; if(beds>=2) s.SJ+=1;
  if(pool) s.NF+=4; else if(jac) s.NF+=2; if(face==="N") s.NF+=2; if(face==="S") s.NF+=.5;
  if(band==="low") s.SP+=3; if(face==="W") s.SP+=1.5; if(size<=30&&!pool) s.SP+=.5;
  const temps=Object.entries(s).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]);
  const intro=face==="N"||pool||band==="high"||band==="top", extra=band==="low"||face==="W";

  const mbti=[...pick[temps[0]],pick[temps[1]][0]];
  return PC[u.id+u.grp]={name,hl:hl.slice(0,3),temps,mbti,face,band,rel,score:s};
}

function pfItem(u){ const R=uRows(u.id), s=R.find(x=>x.grp!=="rent"&&x.price), r=R.find(x=>x.grp==="rent"&&x.rentM), p=persona(u), sea=p.face==="W", pool=/J$|P$/.test(u.type||""), small=u.sqm<=30, val=p.rel<=-0.03, beds=u.type==="2BRJ"?2:1;
  const st=[...(PF_FACE[p.face]||["modern"])]; if(p.band==="high"||p.band==="top") st.unshift("modern"); if(pool) st.unshift("coastal");
  return {code:u.id,u,price:s?s.price:(r?r.rentM:0),prices:{buy:s?s.price:null,rent:r?r.rentM:null},intents:[s&&"buy",r&&"rent"].filter(Boolean),beds,zone:"jomtien",kind:"condo",
    view:sea?"sea":"city",floor:fl(u),quota:u.q==="fr"?"FR":u.q==="th"?"TH":null,furn:true,styles:[...new Set(st)].slice(0,3),mbti:p.mbti,ready:true,
    purpose:{live:beds>=2?1:u.sqm>=35?.8:.6,holiday:(sea?.8:.45)+(pool?.25:0),invest:(val?.75:.45)+(small?.15:0),rent:(small?.45:.3)+(sea?.35:.1)+(val?.1:0)}}; }
function pfCard(it,res){ const mt='<div class="pf-meter"><b>'+res.score+'%</b><i><b style="width:'+res.score+'%"></b></i></div><div class="pf-why">'+res.why.map(w=>'<span>'+HESC(w)+'</span>').join("")+'</div>';
  return card(it.u).replace('<div class="price">',mt+'<div class="price">'); }
const PF_HOST={lang:()=>LANG,products:()=>liveUnits().map(pfItem),card:pfCard,money:v=>v<1e6?"฿"+fmt(v):"฿"+(+(v/1e6).toFixed(2))+"M",
  groupKey:it=>it.u.type+"|"+it.u.side+"|"+BAND(it.u),
  fields:["intent","budget","when","purpose","beds","view","style"],extra:["floor","quota"],
  opts:{budget:{buy:[4.5e6,5e6,6e6,8e6,10e6,12e6,15e6,18e6],rent:[20000,25000,30000,40000,50000,70000,90000]},beds:[1,2],view:["sea","city"],when:["now","q","h","y","later"]},
  TEXT:{th:{title:I18N.th["pf.title"]},en:{title:I18N.en["pf.title"]}},
  dsHome:it=>dsHome(it.u),destinyHref:()=>"#/destiny",
  copy:items=>(LANG==="th"?I18N.th:I18N.en)["pf.list"]+"\n\n"+items.map((it,i)=>{const u=it.u,p=persona(u);return (i+1)+". "+u.id+" · "+p.name+" · "+(u.type?t("ty."+u.type):"")+" · "+t("sqm",{n:u.sqm})+" · "+t("floor",{n:u.floor})+(it.prices.buy?" · ฿"+fmt(it.prices.buy):"")+(it.prices.rent?" · ฿"+fmt(it.prices.rent)+" "+t("perM"):"")+"\n   https://thbho.com/copa1/u/"+u.id+".html";}).join("\n")+"\n\nLINE @copacabanajomtien"};
const PF_UI={};
function mountPF(id){ const el=document.getElementById(id); if(!el||!window.HAIP) return; if(PF_UI[id]&&PF_UI[id].el===el){PF_UI[id].ui.render(); return;} PF_UI[id]={el,ui:HAIP.mount(el,PF_HOST)}; }
const dsCardHTML=()=>window.ASND?'<a class="dscard" href="#/destiny"><img src="hai/img/destiny-hero.jpg" alt="" loading="lazy"><span class="in"><span class="k">Destiny Match · Hybrid AI Agent Network</span><b>'+t("ds.h")+'</b><span class="p">'+t("ds.p")+'</span><span class="go">'+t("ds.go")+'</span></span></a>':"";
const legendHTML=()=>'<div class="mlegend"><span class="eyebrow" style="margin:0">MBTI</span>'+GRP.map(g=>'<span><i style="background:var(--'+g.toLowerCase()+')"></i>'+t("g."+g)+'</span>').join("")+'</div>';
const groupsHTML=()=>'<div class="mgroups">'+GRP.map(g=>'<div class="'+g+'"><div class="mbs">'+GTYPES[g].map(m=>'<span class="'+g+'">'+m+'</span>').join("")+'</div><b>'+t("g."+g)+'</b><p>'+t("gt."+g)+'</p></div>').join("")+'</div>';
function renderHomeMatch(){ const L=$("#mtLegend"); if(!L) return; L.innerHTML=legendHTML(); $("#dsHomeCard").innerHTML=dsCardHTML(); PF_HOST.TEXT.th.title=I18N.th["pf.title"]; mountPF("pfHome"); }
function renderMatchView(){ document.title=t("mt.crumb")+" · Copacabana Beach Jomtien";
  $("#uvB").innerHTML='<a class="uv-back" href="#units">'+t("uv.back")+'</a><p class="eyebrow">'+t("mt.eyebrow")+'</p><h1 style="font-size:clamp(26px,4vw,40px);margin:6px 0 10px">'+t("mt.pageH")+'</h1><p class="lead" style="margin-bottom:18px">'+t("mt.lead")+'</p>'+
   groupsHTML()+'<div id="pfMatch"></div><div style="margin-top:20px">'+dsCardHTML()+'</div><p class="mt-honest">'+t("mt.honest")+' <a href="https://www.16personalities.com/" target="_blank" rel="noopener">16personalities.com ↗</a></p>';
  delete PF_UI.pfMatch; mountPF("pfMatch"); }
function renderDestinyView(code){ document.title="Destiny Match · Copacabana Beach Jomtien";
  if(!window.ASND){ $("#uvB").innerHTML='<a class="uv-back" href="#units">'+t("uv.back")+'</a><p class="note">'+t("ds.na")+'</p>'; return; }
  DS_CACHE=null; ASND.render(code&&uMain(code)?code:null); }
applyLang();
</script>
