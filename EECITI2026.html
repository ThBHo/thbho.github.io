                      <span className="text-xs font-mono font-bold text-ink-primary uppercase">📊 2. Strategic Transport Poll</span>
                      <p className="text-xs font-bold text-ink-secondary">หาก รฟท. ปรับแผนเป็น รถไฟทางคู่ไฟฟ้า 160 กม./ชม. เชื่อมอู่ตะเภาใน 4 ปี ท่านเห็นด้วยหรือไม่?</p>

                      <div className="space-y-2 text-xs font-mono">
                        <button onClick={() => handleVote('opt1')} className={`w-full text-left p-3 rounded-lg border flex justify-between ${pollChoice === 'opt1' ? 'bg-tangerine-50 border-tangerine-600 text-tangerine-900 font-bold' : 'bg-paper-canvas text-ink-primary border-paper-border'}`}>
                          <span>👍 เห็นด้วยอย่างยิ่ง! เปิดวิ่งเร็วได้ใช้งานจริง</span>
                          <span>{pollCounts.opt1} โหวต</span>
                        </button>

                        <button onClick={() => handleVote('opt2')} className={`w-full text-left p-3 rounded-lg border flex justify-between ${pollChoice === 'opt2' ? 'bg-tangerine-50 border-tangerine-600 text-tangerine-900 font-bold' : 'bg-paper-canvas text-ink-primary border-paper-border'}`}>
                          <span>🤔 อยากให้ประมูล ไฮสปีด 250 กม./ชม. ตามเดิม</span>
                          <span>{pollCounts.opt2} โหวต</span>
                        </button>

                        <button onClick={() => handleVote('opt3')} className={`w-full text-left p-3 rounded-lg border flex justify-between ${pollChoice === 'opt3' ? 'bg-tangerine-50 border-tangerine-600 text-tangerine-900 font-bold' : 'bg-paper-canvas text-ink-primary border-paper-border'}`}>
                          <span>🏙️ รูปแบบใดก็ได้ ขอให้เชื่อมสนามบินอู่ตะเภา</span>
                          <span>{pollCounts.opt3} โหวต</span>
                        </button>
                      </div>
                    </div>

                    {/* Digital Pioneer Pass */}
                    <div className="bg-paper-surface border border-paper-border rounded-xl p-6 space-y-3 editorial-card">
                      <span className="text-xs font-mono font-bold text-ink-primary uppercase">💌 Digital Pioneer Pass</span>
                      <p className="text-xs text-ink-muted">ลงทะเบียนรับบัตรสมาชิกร่วมติดตามการพัฒนาเมืองใหม่อัจฉริยะ</p>

                      {!passGenerated ? (
                        <form onSubmit={handleGeneratePass} className="space-y-3 text-xs">
                          <input
                            type="text"
                            placeholder="Full Name / ชื่อ-นามสกุล..."
                            value={userName}
                            onChange={(e) => setUserName(e.target.value)}
                            className="w-full bg-paper-canvas border border-paper-border rounded-lg p-2.5 text-ink-primary focus:outline-none focus:border-tangerine-600"
                            required
                          />
                          <input
                            type="email"
                            placeholder="Email Address / อีเมล..."
                            value={userEmail}
                            onChange={(e) => setUserEmail(e.target.value)}
                            className="w-full bg-paper-canvas border border-paper-border rounded-lg p-2.5 text-ink-primary focus:outline-none focus:border-tangerine-600"
                            required
                          />
                          <button type="submit" className="w-full bg-tangerine-600 hover:bg-tangerine-700 text-white font-bold font-mono py-2.5 rounded-lg transition-colors">
                            ออกบัตร Digital Pioneer Pass
                          </button>
                        </form>
                      ) : (
                        <div className="bg-paper-canvas border border-tangerine-300 p-4 rounded-xl space-y-2 text-center">
                          <span className="text-xs font-mono font-bold text-tangerine-700 block">EEC City Digital Pioneer Pass 2026</span>
                          <span className="editorial-headline text-2xl font-normal text-ink-primary block tracking-wider">{passNumber}</span>
                          <p className="text-[11px] text-ink-muted font-mono">Issued to: {userName}</p>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Editorial Footer */}
          <footer className="hairline-t bg-paper-surface mt-16 py-10 px-4 sm:px-8 text-center text-xs text-ink-muted font-sans space-y-2">
            <div className="max-w-7xl mx-auto space-y-2">
              <p className="font-serif text-sm text-ink-primary"><strong>{t.footerTitle}</strong></p>
              <p className="font-light text-[11px] max-w-2xl mx-auto leading-relaxed">{t.footerSub}</p>
              <div className="pt-4 text-[10px] font-mono text-ink-faint tracking-widest uppercase">
                THE EASTERN CORRIDOR REVIEW • EDITORIAL ISSUE 10 • OCTOBER 2026
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
