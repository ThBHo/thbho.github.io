                    <p className="text-xs text-obsidian-muted font-light leading-relaxed">{t.flag2Desc}</p>
                  </div>
                </div>

                {/* Zone Selectors */}
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 pt-2">
                  {eeciti6ZonesList.map((zone) => (
                    <button
                      key={zone.id}
                      onClick={() => setSelectedZone(zone.id)}
                      className={`p-3.5 rounded-2xl border text-left transition-all ${
                        selectedZone === zone.id
                          ? 'bg-olive-500 text-black border-olive-400 font-bold shadow-lg shadow-olive-500/20'
                          : 'bg-obsidian-card border-obsidian-border text-obsidian-text hover:border-olive-500/40'
                      }`}
                    >
                      <span className={`text-[10px] font-mono block mb-1 uppercase ${selectedZone === zone.id ? 'text-black/80' : 'text-olive-400'}`}>
                        ZONE {zone.id}
                      </span>
                      <span className="text-xs font-display font-bold block truncate">
                        {zone.title[lang].split(":")[1] || zone.title[lang]}
                      </span>
                    </button>
                  ))}
                </div>

                {/* Selected Zone Detail */}
                <div className="bg-obsidian-card border border-obsidian-border rounded-2xl p-6 md:p-8 grid grid-cols-1 md:grid-cols-12 gap-6 items-center bento-card">
                  <div className="md:col-span-7 space-y-4">
                    <div className="flex items-center space-x-3">
                      <span className="bg-olive-950 text-olive-300 text-xs font-mono px-3 py-1 rounded border border-olive-500/30 font-bold">
                        AREA: {eeciti6ZonesList[selectedZone - 1].area}
                      </span>
                    </div>
                    <h3 className="text-xl font-display font-bold text-white">
                      {eeciti6ZonesList[selectedZone - 1].title[lang]}
                    </h3>
                    <p className="text-xs sm:text-sm text-obsidian-muted font-light leading-relaxed">
                      {eeciti6ZonesList[selectedZone - 1].desc[lang]}
                    </p>
                  </div>

                  <div className="md:col-span-5 h-64 rounded-xl overflow-hidden border border-obsidian-border relative">
                    <SafeImage src={eeciti6ZonesList[selectedZone - 1].img} alt="EECiti Zone" className="w-full h-full" />
                  </div>
                </div>
              </div>
            )}

            {/* Section 6: 10 Systems PPP */}
            {}
            {activeNav === 'ppp' && (
              <div className="space-y-6">
                <div className="border-b border-obsidian-border pb-4 flex flex-col md:flex-row md:items-center justify-between gap-2">
                  <div>
                    <h2 className="text-2xl font-display font-bold text-white">{t.pppTitle}</h2>
                    <p className="text-xs text-obsidian-muted mt-1">{t.pppSub}</p>
                  </div>
                  <span className="text-xs font-mono text-olive-400 bg-obsidian-card px-3 py-1.5 rounded-lg border border-obsidian-border">
                    Single Operator 50-Year BOT
                  </span>
                </div>

                {/* Infrastructure Blueprint Image Card */}
                <div className="bg-obsidian-card border border-obsidian-border rounded-2xl p-6 grid grid-cols-1 md:grid-cols-12 gap-6 items-center bento-card">
                  <div className="md:col-span-7 space-y-3">
                    <span className="text-[10px] font-mono bg-olive-500 text-black px-2.5 py-1 rounded font-bold uppercase">
                      COMMON UTILITY TUNNEL (CUT)
                    </span>
                    <h3 className="text-xl font-display font-bold text-white">
                      อุโมงค์รวมระบบสาธารณูปโภค 10 ด้าน ไร้การขุดถนนซ้ำซาก
                    </h3>
                    <p className="text-xs text-obsidian-muted font-light leading-relaxed">
                      ผังจำลองโครงข่ายท่อส่งประปาอัจฉริยะ สายส่งกระแสไฟฟ้าสะอาด 100% ท่อร้อยสายสื่อสาร 5G/6G และระบบน้ำรีไซเคิล Zero Liquid Discharge ที่รวมไว้ในอุโมงค์ใต้ดินคอนกรีตเสริมเหล็ก Common Utility Tunnel (CUT)
                    </p>
                  </div>
                  <div className="md:col-span-5 h-52 rounded-xl overflow-hidden border border-obsidian-border">
                    <SafeImage src="https://i.postimg.cc/D2zsXF6K/10system-EECiti.png" alt="10 Systems CUT Blueprint" className="w-full h-full" />
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  <div className="lg:col-span-5 space-y-2 max-h-[460px] overflow-y-auto pr-2 custom-scrollbar">
                    {ppp10SystemsList.map((sys) => (
                      <button
                        key={sys.id}
                        onClick={() => setSelectedPpp(sys.id)}
                        className={`w-full text-left p-3.5 rounded-xl text-xs font-mono font-semibold flex justify-between items-center transition-all ${
                          selectedPpp === sys.id
                            ? 'bg-olive-500 text-black font-bold shadow-md'
                            : 'bg-obsidian-card border border-obsidian-border text-obsidian-text hover:border-olive-500/40'
                        }`}
                      >
                        <span className="flex items-center space-x-2">
                          <span className="text-base">{sys.icon}</span>
                          <span>#{sys.id} {sys.name[lang]}</span>
                        </span>
                        <span className="text-[10px] opacity-75">50-Yr BOT</span>
                      </button>
                    ))}
                  </div>

                  <div className="lg:col-span-7 bg-obsidian-card rounded-2xl border border-obsidian-border p-6 space-y-5 bento-card">
                    <div className="flex justify-between items-center border-b border-obsidian-border pb-3">
                      <span className="text-xs font-mono font-bold text-olive-400">PPP SYSTEM NODE #{selectedPpp}</span>
                      <span className="text-xs bg-olive-950 text-olive-300 border border-olive-500/30 px-2.5 py-0.5 rounded font-mono">50-Year Concession</span>
                    </div>

                    <h3 className="text-xl font-display font-bold text-white">
                      {ppp10SystemsList[selectedPpp - 1].name[lang]}
                    </h3>

                    <p className="text-xs sm:text-sm text-obsidian-muted font-light leading-relaxed">
                      {ppp10SystemsList[selectedPpp - 1].desc[lang]}
                    </p>

                    <div className="bg-obsidian-bg p-4 rounded-xl border border-obsidian-border text-xs text-obsidian-muted space-y-1">
                      <span className="font-bold text-white font-mono block">BOT Concession Model:</span>
                      <p>{t.pppInvestDesc}</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Section 7: Visa & Incentives Calculator */}
            {}
            {activeNav === 'visa' && (
              <div className="space-y-6">
                <div className="border-b border-obsidian-border pb-4 flex flex-col md:flex-row md:items-center justify-between gap-2">
                  <div>
                    <h2 className="text-2xl font-display font-bold text-white">{t.visaTitle}</h2>
                    <p className="text-xs text-obsidian-muted mt-1">{t.visaSub}</p>
                  </div>
                  <span className="text-xs font-mono text-olive-400 bg-obsidian-card px-3 py-1.5 rounded-lg border border-obsidian-border">
                    Up to 10-Year Fast Track
                  </span>
                </div>

                <div className="bg-obsidian-card border border-obsidian-border rounded-2xl p-6 md:p-8 space-y-6 bento-card">
                  {/* Visual Header for Visa */}
                  <div className="h-44 w-full rounded-2xl overflow-hidden border border-obsidian-border relative">
                    <SafeImage src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=800&auto=format&fit=crop" alt="Global Talent & Regional Headquarters in EEC" className="w-full h-full" />
                    <div className="absolute inset-0 bg-gradient-to-r from-obsidian-card via-obsidian-card/70 to-transparent flex items-center p-6">
                      <div className="max-w-md space-y-1">
                        <span className="text-[10px] font-mono bg-olive-500 text-black px-2 py-0.5 rounded font-bold uppercase">
                          GLOBAL TALENT & RHQ GATEWAY
                        </span>
                        <h4 className="text-lg font-display font-bold text-white">
                          สิทธิประโยชน์ภาษี 17% และพำนักระยะยาวสำหรับผู้เชี่ยวชาญโลก
                        </h4>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                      <label className="block text-xs font-bold font-mono text-olive-400 mb-2 uppercase">{t.visaLabel1}</label>
                      <select
                        value={vSector}
                        onChange={(e) => setVSector(e.target.value)}
                        className="w-full bg-obsidian-bg border border-obsidian-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-olive-500 font-mono"
                      >
                        <option value="airline">Aviation / MRO / EECa Hub</option>
                        <option value="tech">Digital / AI / Hyperscale Data Center</option>
                        <option value="general">General Investors / Real Estate / BCG</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold font-mono text-olive-400 mb-2 uppercase">{t.visaLabel2}</label>
                      <select
                        value={vRole}
                        onChange={(e) => setVRole(e.target.value)}
                        className="w-full bg-obsidian-bg border border-obsidian-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-olive-500 font-mono"
                      >
                        <option value="exec">Senior Executive / Founder</option>
                        <option value="spec">Technical Specialist / Researcher</option>
                      </select>
                    </div>
                  </div>

                  <div className="bg-gradient-to-br from-[#132336] to-obsidian-bg border border-olive-500/40 rounded-2xl p-6 space-y-3">
                    <span className="text-[10px] font-mono font-bold text-olive-400 uppercase">EVALUATED VISA CATEGORY</span>
                    <h3 className="text-xl font-display font-bold text-white">{calculatedVisa.title}</h3>

                    <ul className="space-y-2 text-xs text-obsidian-text/90 font-light pt-2">
                      {calculatedVisa.perks.map((p, i) => (
                        <li key={i} className="flex items-center space-x-2">
                          <span className="text-olive-400 font-bold">✓</span>
                          <span>{p}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              </div>
            )}

            {/* Section 8: Matcher, Poll & Pass */}
            {activeNav === 'matcher' && (
              <div className="space-y-6">
                <div className="border-b border-obsidian-border pb-4">
                  <h2 className="text-2xl font-display font-bold text-white">{t.matcherTitle}</h2>
                  <p className="text-xs text-obsidian-muted mt-1">{t.matcherSub}</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* Quiz Matcher */}
                  <div className="bg-obsidian-card border border-obsidian-border rounded-2xl p-6 space-y-4 bento-card">
                    <span className="text-xs font-mono font-bold text-olive-400 uppercase">🎯 1. EECiti Lifestyle Matcher</span>
                    
                    <div className="space-y-3 text-xs">
                      <div>
                        <label className="block text-obsidian-muted mb-1">{t.quizGoalLbl}</label>
                        <select value={mGoal} onChange={(e) => setMGoal(e.target.value)} className="w-full bg-obsidian-bg border border-obsidian-border rounded-xl p-2.5 text-white font-mono">
                          <option value="live">Live in peaceful 15-min smart city</option>
                          <option value="work">Work in Data Center / CBD / Digital Tech</option>
                          <option value="health">Precision Healthcare & Wellness</option>
                          <option value="edu">International School & Tech Study</option>
                          <option value="sport">Active Sports & Concerts</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-obsidian-muted mb-1">{t.quizVibeLbl}</label>
                        <select value={mVibe} onChange={(e) => setMVibe(e.target.value)} className="w-full bg-obsidian-bg border border-obsidian-border rounded-xl p-2.5 text-white font-mono">
                          <option value="nature">Abundant Green Urban Forest & Canals</option>
                          <option value="modern">Modern Smart Buildings & Co-working</option>
                        </select>
                      </div>
                    </div>

                    <div className="bg-olive-950/80 border border-olive-500/30 p-4 rounded-xl space-y-1">
                      <span className="text-[10px] font-mono text-olive-400 uppercase font-bold">RECOMMENDED MATCHING DISTRICT</span>
                      <h4 className="font-display font-bold text-white text-base">{matchedZoneObj.title[lang]}</h4>
                      <p className="text-xs text-obsidian-muted font-light">{matchedZoneObj.desc[lang]}</p>
                    </div>
                  </div>

                  {/* Poll & Registration */}
                  <div className="space-y-6">
                    <div className="bg-obsidian-card border border-obsidian-border rounded-2xl p-6 space-y-3 bento-card">
                      <span className="text-xs font-mono font-bold text-olive-400 uppercase">📊 2. Strategic Transport Poll</span>
                      <p className="text-xs font-bold text-white">{t.pollQ}</p>

                      <div className="space-y-2 text-xs font-mono">
                        <button onClick={() => handleVote('opt1')} className={`w-full text-left p-3 rounded-xl border flex justify-between ${pollChoice === 'opt1' ? 'bg-olive-500 text-black font-bold' : 'bg-obsidian-bg text-white border-obsidian-border'}`}>
                          <span>{t.pollOpt1}</span>
                          <span>{pollCounts.opt1} {t.pollSuffix}</span>
                        </button>

                        <button onClick={() => handleVote('opt2')} className={`w-full text-left p-3 rounded-xl border flex justify-between ${pollChoice === 'opt2' ? 'bg-olive-500 text-black font-bold' : 'bg-obsidian-bg text-white border-obsidian-border'}`}>
                          <span>{t.pollOpt2}</span>
                          <span>{pollCounts.opt2} {t.pollSuffix}</span>
                        </button>

                        <button onClick={() => handleVote('opt3')} className={`w-full text-left p-3 rounded-xl border flex justify-between ${pollChoice === 'opt3' ? 'bg-olive-500 text-black font-bold' : 'bg-obsidian-bg text-white border-obsidian-border'}`}>
                          <span>{t.pollOpt3}</span>
                          <span>{pollCounts.opt3} {t.pollSuffix}</span>
                        </button>
                      </div>
                    </div>

                    {/* Pass Registration */}
                    <div className="bg-obsidian-card border border-obsidian-border rounded-2xl p-6 space-y-3 bento-card">
                      <span className="text-xs font-mono font-bold text-olive-400 uppercase">{t.clubTitle}</span>
                      <p className="text-xs text-obsidian-muted">{t.clubSub}</p>

                      {!passGenerated ? (
                        <form onSubmit={handleGeneratePass} className="space-y-3 text-xs">
                          <input
                            type="text"
                            placeholder="Full Name / ชื่อ-นามสกุล..."
                            value={userName}
                            onChange={(e) => setUserName(e.target.value)}
                            className="w-full bg-obsidian-bg border border-obsidian-border rounded-xl p-2.5 text-white focus:outline-none focus:border-olive-500"
                            required
                          />
                          <input
                            type="email"
                            placeholder="Email Address / อีเมล..."
                            value={userEmail}
                            onChange={(e) => setUserEmail(e.target.value)}
                            className="w-full bg-obsidian-bg border border-obsidian-border rounded-xl p-2.5 text-white focus:outline-none focus:border-olive-500"
                            required
                          />
                          <button type="submit" className="w-full bg-olive-500 hover:bg-olive-400 text-black font-bold font-mono py-2.5 rounded-xl transition-all">
                            {t.clubBtn}
                          </button>
                        </form>
                      ) : (
                        <div className="bg-gradient-to-r from-olive-950 to-obsidian-bg border border-olive-500/40 p-4 rounded-xl space-y-2 text-center">
                          <span className="text-xs font-mono font-bold text-olive-400 block">{t.passTitle}</span>
                          <span className="text-lg font-mono font-bold text-white block tracking-widest">{passNumber}</span>
                          <p className="text-[11px] text-obsidian-muted font-mono">Issued to: {userName}</p>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12 pt-6 border-t border-obsidian-border text-center text-xs text-obsidian-muted font-sans">
            <p className="mb-2"><strong>{t.footerTitle}</strong></p>
            <p className="text-[11px] font-light text-obsidian-muted/80">{t.footerSub}</p>
          </footer>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
