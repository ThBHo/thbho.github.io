# Copies listing photos and videos to the Cloudflare R2 bucket that will serve them
# (media.asnproperty.com), so the GitHub Pages site stays well under its 1 GB limit.
#
# One-time setup by the account owner (Settings → Secrets and variables → Actions):
#   R2_ACCOUNT_ID         Cloudflare account ID
#   R2_ACCESS_KEY_ID      R2 API token: Access Key ID   (Object Read & Write, this bucket only)
#   R2_SECRET_ACCESS_KEY  R2 API token: Secret Access Key
#   and the variable R2_BUCKET (default: asn-media)
# Until the secrets exist the job stops with a notice instead of failing.
#
# Runs on every push that changes asn-img/, or by hand from the Actions tab.
# It only adds and updates files in the bucket; it never deletes there.
name: media-sync

on:
  push:
    branches: [main]
    paths: ["asn-img/**"]
  workflow_dispatch:
    inputs:
      folder:
        description: "Folder to copy (its name becomes the prefix in the bucket)"
        default: "asn-img"
        required: true

concurrency:
  group: media-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FOLDER: ${{ github.event.inputs.folder || 'asn-img' }}
      BUCKET: ${{ vars.R2_BUCKET || 'asn-media' }}
      HAS_KEYS: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_ACCOUNT_ID != '' }}
    steps:
      - name: Check secrets
        if: env.HAS_KEYS != 'true'
        run: echo "::notice::R2 secrets are not set yet; nothing was copied. See the comment at the top of media-sync.yml."
      - uses: actions/checkout@v4
        if: env.HAS_KEYS == 'true'
        with:
          sparse-checkout: ${{ env.FOLDER }}
      - name: Copy to Cloudflare R2
        if: env.HAS_KEYS == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          test -d "$FOLDER" || { echo "::error::Folder $FOLDER not found"; exit 1; }
          aws s3 sync "$FOLDER" "s3://$BUCKET/$FOLDER" --endpoint-url "$ENDPOINT" \
            --exclude "*.DS_Store" --cache-control "public, max-age=2592000" --only-show-errors
          n=$(find "$FOLDER" -type f | wc -l)
          echo "::notice::Copied $FOLDER ($n files) to $BUCKET"
